        </nav>
    </header>
    <main class="container">
        <section class="card" style="text-align: center;">
            <h2>Visualización en vivo</h2>
            <div id="canvas-box" class="canvas-container"></div>
        </section>
    </main>
    <script>
        var tamOjo = 20;
        var altdi = 15;

        function setup() {
            let canvas = createCanvas(400, 400);
            canvas.parent('canvas-box');
        }
        function draw() {
            background(255);
            ellipse(150, 70, 60, 120); // Oreja izquierda
            ellipse(240, 70, 60, 120); // Oreja derecha
            ellipse(200, 170, 150, 150); // Cara

            fill(0, 0, 0);
            ellipse(170, 150, tamOjo, tamOjo); // Ojo izquierdo
            ellipse(230, 150, tamOjo, tamOjo); // Ojo derecho

            line(150, 200, 250, 200); // Boca

            noFill();
            rect(185, 200, 15, altdi); // Diente izquierdo
            rect(200, 200, 15, altdi); // Diente derecho
        }
    </script>
</body>
</html>
