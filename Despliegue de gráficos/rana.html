            </ul>
        </nav>
    </header>
    <main class="container">
        <section class="card" style="text-align: center;">
            <h2>Visualización en vivo</h2>
            <div id="canvas-box" class="canvas-container"></div>
        </section>
    </main>
    <script>
        var x = 200;
        var y = 250;

        function setup() {
            let canvas = createCanvas(400, 400);
            canvas.parent('canvas-box');
        }
        function draw() {
            background(255);
            noStroke();
            fill(30, 204, 91);

            ellipse(x, y, 200, 100);
            ellipse(x - 50, y - 50, 40, 40);
            ellipse(x + 50, y - 50, 40, 40);

            fill(255, 255, 255);
            ellipse(x - 50, y - 50, 30, 30); 
            ellipse(x + 50, y - 50, 30, 30); 

            fill(0, 0, 0);
            ellipse(x, y, 125, 55);

            rect(x - 55, y - 55, 10, 10); 
            rect(x + 45, y - 55, 10, 10); 
        }
    </script>
</body>
</html>
