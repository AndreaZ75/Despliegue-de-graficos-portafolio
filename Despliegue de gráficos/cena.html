<body>

        </nav>
    </header>
    <main class="container">
        <section class="card" style="text-align: center;">
            <h2>Visualización en vivo</h2>
            <div id="canvas-box" class="canvas-container"></div>
        </section>
    </main>
    <script>
        function setup() {
            let canvas = createCanvas(400, 400);
            canvas.parent('canvas-box');
        }
        function draw() {
            background(186, 145, 20); // Mesa de madera
            
            fill(255, 255, 255); // Plato exterior de color blanco
            ellipse(200, 200, 350, 350); 
            
            fill(255, 255, 255); // Plato interior (o base del plato)
            ellipse(200, 200, 300, 300);

            fill(255, 204, 0); // Pizza
            triangle(150, 150, 250, 150, 200, 260); // Masa de pizza

            var circP = 20;
            fill(200, 0, 0); // Peperoni
            ellipse(180, 170, circP, circP);
            ellipse(215, 185, circP, circP);
            ellipse(200, 220, circP, circP);

            var circG = 18;
            fill(34, 139, 34); // Guisantes
            ellipse(130, 230, circG, circG);
            ellipse(145, 240, circG, circG);
            ellipse(125, 250, circG, circG);

            fill(139, 69, 19); // Carne
            rect(225, 210, 50, 35, 10);
        }
    </script>
</body>
</html>
