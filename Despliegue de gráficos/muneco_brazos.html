<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Muñeco de Nieve con Brazos - p5.js</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
</head>
<body>
    <header>
        <h1>Proyecto: Muñeco de Nieve con Brazos</h1>
        <nav>
            <ul>
                <li><a href="indexKT.html">Portada</a></li>
                <li><a href="teoria.html">Teoría</a></li>
                <li><a href="dom-inspector.html">Inspector DOM</a></li>
                <li><a href="muneco.html">Muñeco de Nieve Color</a></li>
                <li><a href="muneco_brazos.html" class="active">Muñeco con Brazos</a></li>
                <li><a href="cena.html">La Cena</a></li>
                <li><a href="bucky.html">Dientes de Conejo</a></li>
                <li><a href="rana.html">La Rana</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <section class="card" style="text-align: center;">
            <h2>Visualización en vivo</h2>
            <div id="canvas-box" class="canvas-container"></div>
        </section>
    </main>
    <script>
        function setup() {
            let canvas = createCanvas(400, 400);
            canvas.parent('canvas-box');
        }
        function draw() {
            background(255); // Fondo blanco
            
            rect(0, 350, 400, 50);   // Suelo inferior
            
            // Círculos del muñeco
            ellipse(200, 300, 150, 150); // Base
            ellipse(200, 200, 100, 100); // Medio
            ellipse(200, 120, 75, 75);   // Cabeza
            
            // Brazos de líneas
            line(160, 200, 100, 150); // Brazo izquierdo
            line(240, 200, 300, 150); // Brazo derecho
        }
    </script>
</body>
</html>
