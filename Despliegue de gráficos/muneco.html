<body>
    <header>
        <h1>Proyecto: Muñeco de Nieve</h1>
        <nav>
            <ul>
                <li><a href="indexKT.html">Portada</a></li>
                <li><a href="teoria.html">Teoría</a></li>

            </ul>
        </nav>
    </header>
    <main class="container">
        <section class="card" style="text-align: center;">
            <h2>Visualización en vivo</h2>
            <div id="canvas-box" class="canvas-container"></div>
        </section>
    </main>
    <script>
        function setup() {
            let canvas = createCanvas(400, 400);
            canvas.parent('canvas-box');
        }
        function draw() {
            background(84, 222, 208); // Fondo celeste
            
            fill(33, 255, 81); // Color verde para el suelo
            rect(0, 300, 400, 100); // El suelo
            
            fill(227, 252, 3); // Color amarillo para el sol
            ellipse(80, 64, 100, 100); // El sol
            
            fill(255, 255, 255); // Color blanco para el muñeco
            ellipse(200, 300, 150, 150); // Parte de abajo
            ellipse(200, 200, 100, 100); // Parte del medio
            ellipse(200, 120, 75, 75);   // Cabeza
        }
    </script>
</body>
</html>
